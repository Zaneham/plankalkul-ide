name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-lsp-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14.x

      - name: Install dependencies
        working-directory: lsp
        run: opam install . --deps-only --yes

      - name: Build
        working-directory: lsp
        run: opam exec -- dune build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-linux-x64
          path: lsp/_build/default/src/server.exe

  build-lsp-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14.x

      - name: Install dependencies
        working-directory: lsp
        run: opam install . --deps-only --yes

      - name: Build
        working-directory: lsp
        run: opam exec -- dune build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-darwin-x64
          path: lsp/_build/default/src/server.exe

  build-lsp-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14.x

      - name: Install dependencies
        working-directory: lsp
        run: opam install . --deps-only --yes

      - name: Build
        working-directory: lsp
        run: opam exec -- dune build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-darwin-arm64
          path: lsp/_build/default/src/server.exe

  build-lsp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14.x

      - name: Install dependencies
        working-directory: lsp
        run: opam install . --deps-only --yes

      - name: Build
        working-directory: lsp
        run: opam exec -- dune build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-windows-x64
          path: lsp/_build/default/src/server.exe

  package-extension:
    needs: [build-lsp-linux, build-lsp-macos-intel, build-lsp-macos-arm, build-lsp-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download LSP artifacts
        uses: actions/download-artifact@v4
        with:
          path: lsp-binaries

      - name: Prepare LSP binaries
        run: |
          mkdir -p vscode/bin
          cp lsp-binaries/lsp-linux-x64/server.exe vscode/bin/plankalkul-lsp-linux-x64
          cp lsp-binaries/lsp-darwin-x64/server.exe vscode/bin/plankalkul-lsp-darwin-x64
          cp lsp-binaries/lsp-darwin-arm64/server.exe vscode/bin/plankalkul-lsp-darwin-arm64
          cp lsp-binaries/lsp-windows-x64/server.exe vscode/bin/plankalkul-lsp-windows-x64.exe
          chmod +x vscode/bin/plankalkul-lsp-*

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        working-directory: vscode
        run: vsce package --out plankalkul.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: plankalkul-vsix
          path: vscode/plankalkul.vsix

  release:
    needs: [package-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: plankalkul-vsix
          path: release

      - name: Download LSP binaries
        uses: actions/download-artifact@v4
        with:
          path: lsp-binaries

      - name: Prepare standalone LSP binaries
        run: |
          mkdir -p release/lsp
          cp lsp-binaries/lsp-linux-x64/server.exe release/lsp/plankalkul-lsp-linux-x64
          cp lsp-binaries/lsp-darwin-x64/server.exe release/lsp/plankalkul-lsp-darwin-x64
          cp lsp-binaries/lsp-darwin-arm64/server.exe release/lsp/plankalkul-lsp-darwin-arm64
          cp lsp-binaries/lsp-windows-x64/server.exe release/lsp/plankalkul-lsp-windows-x64.exe
          cd release && sha256sum plankalkul.vsix lsp/* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/plankalkul.vsix
            release/lsp/plankalkul-lsp-linux-x64
            release/lsp/plankalkul-lsp-darwin-x64
            release/lsp/plankalkul-lsp-darwin-arm64
            release/lsp/plankalkul-lsp-windows-x64.exe
            release/checksums.txt
          body: |
            ## Plankalkül IDE

            VS Code extension for Plankalkül with Language Server Protocol support.

            ### Installation

            **Option 1: VS Code Marketplace** (recommended)
            Search for "Plankalkül" in VS Code extensions.

            **Option 2: Manual Install**
            Download `plankalkul.vsix` and run:
            ```bash
            code --install-extension plankalkul.vsix
            ```

            ### Features

            - Syntax highlighting for `.pk` (linear) and `.pk2d` (2D notation)
            - 2D Grid Editor for Zuse's original notation
            - Diagnostics, completions, and hover documentation
            - Commands to compile and convert between notations
          draft: false
          prerelease: false

  # Auto-publish to VS Code Marketplace
  publish:
    needs: [package-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: plankalkul-vsix
          path: .

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath plankalkul.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
